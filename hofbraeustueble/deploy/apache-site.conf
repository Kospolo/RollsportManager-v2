# Hofbräustüble – Apache-Einstellungen im Container
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Vorschau: nicht in Suchmaschinen aufnehmen (vor dem echten Start entfernen)
Header always set X-Robots-Tag "noindex, nofollow"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Hinter dem Nginx Proxy Manager: HTTPS-Erkennung über X-Forwarded-Proto
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
