# CI for RollsportManager v2 (Blueprint ADR-E1: the codegen gate runs before
# any feature code is merged). Simple on purpose - no deployment steps here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Design tokens: design/tokens.json -> apps/web/app/tokens.css must be current.
  tokens-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tokens
        run: node packages/tokens/build.mjs
      - name: Fail if checked-in tokens.css is stale
        run: git diff --exit-code apps/web/app/tokens.css

  # Next.js portal builds (still mock-backed; the generated API client only
  # has to typecheck/compile, nothing is wired up yet).
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # API unit tests (no network, no database) + typecheck.
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # THE contract gate: openapi.json must match the API, schema sanity must
  # hold, and every generated file (TS/Swift/Kotlin) must be committed in sync.
  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install API workspace (needed to regenerate the spec)
        run: npm ci
        working-directory: services/api
      - name: Contracts check (spec regen + sanity + codegen drift)
        run: node packages/contracts/codegen/check.mjs --require-spec-regen

  # Optional: end-to-end smoke against a throwaway Postgres (needs Docker).
  # Boots postgres:16-alpine as rsm2-pg-test on 127.0.0.1:55436, always
  # removed via trap - see services/api/scripts/api-db-test.sh.
  db-test:
    runs-on: ubuntu-latest
    continue-on-error: true # optional job - Docker smoke must not block merges
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - name: DB smoke test (throwaway container)
        run: npm run db:test
