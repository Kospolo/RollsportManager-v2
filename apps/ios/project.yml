# xcodegen-Projektdefinition — RollsportManager v2 (iOS + macOS)
# Projekt neu generieren:  xcodegen generate   (in apps/ios)
#
# Quellen:
#   App/                                  — SwiftUI-App (Feature-Module, DesignSystem, Networking)
#   AppMac/                               — NUR macOS: Seitenleisten-Wurzel, Menues, Plattform-Bruecke
#   App/Generated/Theme.swift             — NUR Codegen: npm run gen:swift (packages/tokens)
#   packages/contracts/generated/swift/   — NUR Codegen: npm run generate (packages/contracts)
#
# ZWEI ZIELE, EINE QUELLBASIS
# `RollsportManagerMac` bindet EXAKT dieselben Dateien ein wie das iOS-Ziel und
# legt nur AppMac/ obendrauf. Es gibt bewusst KEINE Kopie der Feature-Module:
# ein Feature, das ein Team in App/ baut, ist am Mac sofort mit dabei. Die
# Plattform-Unterschiede liegen an genau zwei Stellen — den #if-Weichen in
# RollsportManagerApp.swift und der Bruecke AppMac/MacPlatformShims.swift.
name: RollsportManager
options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RollsportManager:
    type: application
    platform: iOS
    sources:
      - path: App
      # Generierte API-Contracts (Swift-Structs aus der OpenAPI-Spec) werden
      # direkt aus packages/contracts eingebunden — nie kopieren, nie editieren.
      - path: ../../packages/contracts/generated/swift
        name: GeneratedContracts
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: RollsportManager
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dev-Stack spricht http://127.0.0.1:3022 — Loopback ist von ATS
        # ausgenommen, NSAllowsLocalNetworking macht das explizit.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rollsportmanager.v2
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        # App-Icon aus App/Assets.xcassets (aus v1 uebernommen: Figuren ueber
        # Rollschuh-Rad). Single-Size-Format mit hell/dunkel/getoent (iOS 18).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RollsportManagerMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # DIESELBEN Quellen wie iOS — kein Fork, keine Auswahl-Liste, die
      # jemand pflegen muesste.
      - path: App
      - path: ../../packages/contracts/generated/swift
        name: GeneratedContracts
      # Nur-Mac: Seitenleiste, Menuebefehle, Plattform-Bruecke, App-Icon.
      - path: AppMac
    # ACHTUNG: `info`/`entitlements` sind bei xcodegen ERZEUGTE Dateien —
    # Support/Info-macOS.plist und Support/RollsportManager-macOS.entitlements
    # werden bei jedem `xcodegen generate` aus den folgenden Eintraegen neu
    # geschrieben. Wer dort von Hand editiert, verliert es beim naechsten Lauf.
    # Quelle der Wahrheit ist also DIESE Datei (wie beim iOS-Ziel).
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: RollsportManager
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Der Dev-Stack spricht http://127.0.0.1:3022 und laeuft auf DERSELBEN
        # Maschine wie die Mac-App. NSAllowsLocalNetworking nimmt Loopback und
        # lokales Netz von ATS aus — kein Prod-Mechanismus.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          RollsportManager spricht mit dem Vereins-Server. In dieser
          Entwicklungsfassung ist das der lokale Dev-Stack auf diesem Mac.
    entitlements:
      path: Support/RollsportManager-macOS.entitlements
      properties:
        # Sandbox AN. Eine Vereins-App verwaltet Daten von Kindern; sie hat
        # keinen Grund, ausserhalb ihres Containers zu lesen oder zu schreiben.
        # Wer das hier lockert, muss sagen wofuer.
        com.apple.security.app-sandbox: true
        # Ausgehende Verbindungen zur API. Mehr nicht: KEIN network.server,
        # KEIN Zugriff auf Fotos/Kontakte/Kalender, KEINE Kamera, KEIN Mikrofon.
        com.apple.security.network.client: true
        # Vom Nutzer AUSGEWAEHLTE Dateien lesen (Datei-Dialog fuer Logo-/
        # Dokument-Upload). Nur lesend, nur was er selbst im Dialog anfasst.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rollsportmanager.v2.mac
        PRODUCT_NAME: RollsportManager
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        # Lokal signieren („Sign to Run Locally"): das Ziel laeuft auf dieser
        # Maschine, ohne Entwickler-Team im Repo zu verdrahten. Fuer eine
        # Verteilung (Notarisierung) wird das hier bewusst umgestellt.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        COMBINE_HIDPI_IMAGES: YES

schemes:
  RollsportManager:
    build:
      targets:
        RollsportManager: all
    run:
      config: Debug
    archive:
      config: Release
  RollsportManagerMac:
    build:
      targets:
        RollsportManagerMac: all
    run:
      config: Debug
    archive:
      config: Release
